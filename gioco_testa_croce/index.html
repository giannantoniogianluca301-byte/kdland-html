<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>🎲 Testa o Croce Online</title>
  <style>
    body { font-family: Arial; text-align: center; background-color: #f0f0f5; }
    input, select, button { font-size: 16px; padding: 5px; margin: 5px; }
    h1, h2, h3 { color: #333; }
  </style>
</head>
<body>
  <h1>🎲 TESTA O CROCE 💰</h1>

  <input id="nome" placeholder="Il tuo nome">
  <br><br>

  <select id="scelta">
    <option value="Testa">Testa</option>
    <option value="Croce">Croce</option>
  </select>
  <input id="puntata" type="number" value="10" min="1">
  <button onclick="gioca()">Lancia!</button>

  <h3 id="risultato">Fai la tua scommessa!</h3>

  <h2>🏆 CLASSIFICA 🏆</h2>
  <ul id="classifica"></ul>

  <script>
    async function gioca() {
      const nome = document.getElementById('nome').value.trim();
      const scelta = document.getElementById('scelta').value;
      const puntata = document.getElementById('puntata').value;

      const res = await fetch('/gioca', {
        method: 'POST',
        body: new URLSearchParams({ nome, scelta, puntata })
      });
      const data = await res.json();

      if (data.errore) {
        alert(data.errore);
        return;
      }

      document.getElementById('risultato').innerText =
        `Hai ${data.esito}! È uscito ${data.risultato}. Saldo: ${data.saldo}$`;

      aggiornaClassifica();
    }

    async function aggiornaClassifica() {
      const res = await fetch('/classifica');
      const data = await res.json();
      const lista = document.getElementById('classifica');
      lista.innerHTML = '';
      data.forEach(([nome, saldo]) => {
        const li = document.createElement('li');
        li.textContent = `${nome}: ${saldo}$`;
        lista.appendChild(li);
      });
    }

    setInterval(aggiornaClassifica, 2000);
    aggiornaClassifica();
  </script>
</body>
</html>
